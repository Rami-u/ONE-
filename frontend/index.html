<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>وجهة — تعلّم مع المعلّم</title>
    <script>
      // Apply the theme before React mounts (rule: HTML shell sets the initial theme).
      // Follows the system preference until the user explicitly picks a mode.
      (() => {
        try {
          const saved = localStorage.getItem("wajha-theme");
          const dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch {
          /* defaults to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
